name: Update IBGE Data

on:
  schedule:
    # Executa mensalmente no dia 1 às 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-ibge:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run IBGE extraction script
      run: python fetch_ibge_ppm.py
      
    - name: Commit and push changes
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add mel_export.db
        git commit -m "Update IBGE data (Automated)" || echo "No changes to commit"
        git push
